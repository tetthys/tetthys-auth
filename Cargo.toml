[package]
name = "tetthys-auth"
version = "0.1.2"
edition = "2021"

description = "Framework-agnostic authentication/authorization core for Rust applications."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/tetthys/tetthys-auth"
keywords = ["auth", "authentication", "authorization"]
categories = ["authentication"]

[features]
default = []
# Enables Leptos + Axum SSR adapter module(s).
axum-ssr = [
  "dep:axum",
  "dep:axum-extra",
  "dep:leptos",
  "dep:leptos_axum",
]

[dependencies]
# --- Adapter-only deps (feature-gated) ---
axum = { version = "0.8.0", optional = true }
axum-extra = { version = "0.10", features = ["cookie"], optional = true }
leptos = { version = "0.8.0", optional = true }
leptos_axum = { version = "0.8.0", optional = true }

[dev-dependencies]
futures = "0.3"
